<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GymLog">
<meta name="theme-color" content="#05060d">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.json">
<title>GymLog</title>
<style>
:root{
  --glass:rgba(255,255,255,.085);--glass2:rgba(255,255,255,.14);--stroke:rgba(255,255,255,.17);
  --text:#fff;--text2:rgba(235,235,245,.66);--text3:rgba(235,235,245,.38);
  --blue:#0a84ff;--green:#32d74b;--red:#ff453a;--orange:#ff9f0a;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#05060d;color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer}
input,textarea{font-family:inherit;color:inherit}
.bg{position:fixed;inset:0;z-index:-1;background:#05060d;overflow:hidden}
.bg i{position:absolute;border-radius:50%;filter:blur(80px);opacity:.8;animation:drift 24s ease-in-out infinite alternate}
.bg i:nth-child(1){width:70vmax;height:70vmax;left:-25vmax;top:-22vmax;background:#0a84ff}
.bg i:nth-child(2){width:55vmax;height:55vmax;right:-22vmax;top:28%;background:#bf5af2;animation-delay:-8s}
.bg i:nth-child(3){width:60vmax;height:60vmax;left:0;bottom:-30vmax;background:#1fd1c1;opacity:.5;animation-delay:-14s}
.bg::after{content:"";position:absolute;inset:0;background:rgba(5,6,13,.42)}
@keyframes drift{to{transform:translate(9vmax,-7vmax) scale(1.18)}}
@media (prefers-reduced-motion:reduce){.bg i{animation:none}}

#app{height:100dvh;max-width:560px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;position:relative}
.screen{display:none;flex-direction:column;flex:1;min-height:0}
.screen.active{display:flex;animation:in .28s ease}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 16px calc(var(--sab) + 24px)}

.glass{background:var(--glass);backdrop-filter:blur(26px) saturate(180%);-webkit-backdrop-filter:blur(26px) saturate(180%);border:1px solid var(--stroke);border-radius:22px;box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 10px 30px rgba(0,0,0,.22)}

.topbar{display:flex;align-items:center;gap:10px;padding:calc(var(--sat) + 12px) 16px 10px;flex-shrink:0}
.tb-title{flex:1;min-width:0}
.tb-title small{display:block;font-size:12px;color:var(--text2);letter-spacing:.02em}
.tb-title h1{font-size:22px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-btn{height:38px;min-width:38px;padding:0 14px;border-radius:19px;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--glass2);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--stroke);flex-shrink:0}
.tb-btn:active{transform:scale(.95)}
.tb-btn.round{padding:0;width:38px;font-size:20px}
.avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;background:linear-gradient(145deg,var(--h),color-mix(in srgb,var(--h) 55%,#000));box-shadow:inset 0 1px 0 rgba(255,255,255,.35);flex-shrink:0}

/* profile */
.hero{text-align:center;padding:calc(var(--sat) + 9vh) 0 28px}
.hero .logo{font-size:44px;font-weight:800;letter-spacing:-.04em}
.hero p{color:var(--text2);margin-top:6px;font-size:17px}
.pcard{display:flex;align-items:center;gap:16px;width:100%;padding:18px;margin-bottom:14px;text-align:left}
.pcard:active{transform:scale(.985)}
.pcard .avatar{width:58px;height:58px;font-size:24px}
.pc-name{font-size:21px;font-weight:700}
.pc-sub{font-size:13px;color:var(--text2);margin-top:3px}
.chev{margin-left:auto;font-size:26px;color:var(--text3)}
.linkbtn{display:block;margin:22px auto 0;color:var(--text2);font-size:14px;padding:10px}

/* chips */
.chip{display:inline-flex;align-items:center;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip.up{background:rgba(50,215,75,.18);color:#62f07c}
.chip.down{background:rgba(255,69,58,.18);color:#ff8179}
.chip.flat{background:rgba(255,255,255,.1);color:var(--text2)}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:var(--blue);color:#fff}

/* home */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.tile{padding:13px 12px}
.tile small{display:block;font-size:11px;color:var(--text2);margin-bottom:6px}
.tile b{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tile .chip{margin-top:2px}
.scard{display:flex;align-items:center;gap:14px;padding:15px;margin-bottom:11px;flex-wrap:wrap}
.scard.next{border-color:rgba(10,132,255,.7);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 0 0 1px rgba(10,132,255,.35),0 10px 30px rgba(10,132,255,.18)}
.scard:active{transform:scale(.985)}
.snum{width:42px;height:42px;border-radius:14px;background:var(--glass2);border:1px solid var(--stroke);display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:700;flex-shrink:0}
.sbody{flex:1;min-width:0}
.sname{font-size:16.5px;font-weight:650;letter-spacing:-.01em}
.ssub{font-size:12.5px;color:var(--text2);margin-top:2px}
.smeta{font-size:12px;color:var(--text3);margin-top:3px}
.sright{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0}
.sdate{font-size:12px;color:var(--text2)}
.sdate.muted{color:var(--text3)}
.ctrls{display:flex;gap:8px;width:100%;padding-top:4px}
.ctrl{flex:1;height:36px;border-radius:12px;background:rgba(255,255,255,.09);border:1px solid var(--stroke);font-size:14px;font-weight:600}
.ctrl.del{color:#ff8179}
.ctrl:active{background:rgba(255,255,255,.18)}

/* session */
.ecard{display:flex;align-items:center;gap:12px;padding:13px 14px 13px 0;margin-bottom:10px;overflow:hidden;flex-wrap:wrap}
.ecard:active{transform:scale(.985)}
.ebar{width:4px;align-self:stretch;background:var(--c);border-radius:0 4px 4px 0;flex-shrink:0;margin-right:2px;box-shadow:0 0 14px var(--c)}
.ebody{flex:1;min-width:0}
.ename{font-size:15px;font-weight:650;letter-spacing:-.01em}
.etarget{font-size:12px;color:var(--text3);margin-top:2px}
.elast{font-size:12.5px;color:var(--text2);margin-top:5px;font-variant-numeric:tabular-nums}
.elast b{color:#fff;font-weight:600}
.eright{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.done{width:24px;height:24px;border-radius:50%;background:var(--green);color:#04210c;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
.ecard .ctrls{padding:0 0 0 14px}
.footer{flex-shrink:0;padding:12px 16px calc(var(--sab) + 14px);background:linear-gradient(to top,rgba(5,6,13,.55),transparent)}
.prog{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:12px;color:var(--text2);font-variant-numeric:tabular-nums}
.bar{flex:1;height:5px;background:rgba(255,255,255,.12);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#0a84ff,#5ac8fa);border-radius:9px;transition:width .4s}

.btn{width:100%;padding:15px;border-radius:17px;font-size:16px;font-weight:650;display:flex;align-items:center;justify-content:center;gap:8px;letter-spacing:-.01em}
.btn:active{transform:scale(.98);opacity:.9}
.btn.primary{background:linear-gradient(180deg,#2b95ff,#0a84ff);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 8px 22px rgba(10,132,255,.35)}
.btn.ghost{background:var(--glass2);border:1px solid var(--stroke);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.btn.danger{background:rgba(255,69,58,.16);border:1px solid rgba(255,69,58,.4);color:#ff8179}
.btn+.btn{margin-top:10px}
.btns{display:flex;gap:10px;margin-top:14px}
.btns .btn+.btn{margin-top:0}

/* log */
.prev{padding:14px 16px;margin-bottom:16px}
.prev h4{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--text2);font-weight:700;margin-bottom:8px;display:flex;justify-content:space-between}
.prow{display:flex;justify-content:space-between;font-size:14.5px;padding:3px 0;font-variant-numeric:tabular-nums;color:var(--text)}
.prow span:first-child{color:var(--text2)}
.note-prev{font-size:12px;color:var(--text3);margin-top:6px;font-style:italic}
.sec{display:flex;align-items:center;justify-content:space-between;margin:2px 4px 10px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--text2);font-weight:700}
.sets-h,.set-row{display:grid;grid-template-columns:34px 1fr 1fr 34px;gap:9px;align-items:center}
.sets-h{margin-bottom:6px;font-size:11px;color:var(--text3);text-align:center;text-transform:uppercase;letter-spacing:.06em}
.set-row{margin-bottom:9px}
.sn{width:34px;height:34px;border-radius:50%;background:var(--glass2);border:1px solid var(--stroke);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--text2)}
.si{width:100%;padding:13px 6px;border-radius:15px;text-align:center;font-size:21px;font-weight:650;font-variant-numeric:tabular-nums;background:rgba(255,255,255,.08);border:1px solid var(--stroke);outline:none;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.si:focus{border-color:rgba(10,132,255,.9);background:rgba(10,132,255,.12)}
.si::placeholder{color:var(--text3);font-weight:500}
.x{width:34px;height:34px;border-radius:50%;color:var(--text3);font-size:15px}
.x:active{background:var(--glass2)}
.x:disabled{opacity:.25}
.livebox{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;margin:6px 0 14px;font-size:14px;color:var(--text2)}
textarea.note{width:100%;min-height:68px;padding:13px 15px;border-radius:17px;background:rgba(255,255,255,.07);border:1px solid var(--stroke);outline:none;font-size:15px;resize:none;margin-bottom:14px}
textarea.note::placeholder{color:var(--text3)}

/* history */
.spark{padding:14px 12px 8px;margin-bottom:14px}
.spark svg{width:100%;height:auto;display:block}
.hitem{padding:13px 16px;margin-bottom:9px}
.hhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:13px;color:var(--text2)}

/* sheet */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.overlay.hidden{display:none}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:560px;max-height:88dvh;overflow-y:auto;padding:12px 20px calc(var(--sab) + 22px);border-radius:28px 28px 0 0;background:rgba(32,34,48,.72);backdrop-filter:blur(40px) saturate(190%);-webkit-backdrop-filter:blur(40px) saturate(190%);border:1px solid var(--stroke);border-bottom:none;animation:up .3s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(60px);opacity:0}}
.grab{width:38px;height:5px;border-radius:3px;background:rgba(255,255,255,.28);margin:0 auto 14px}
.sheet h3{font-size:20px;font-weight:700;margin-bottom:14px;letter-spacing:-.02em}
.fl{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--text2);font-weight:700;margin:14px 2px 7px}
.field{width:100%;padding:13px 15px;border-radius:15px;background:rgba(255,255,255,.09);border:1px solid var(--stroke);outline:none;font-size:16px}
.field:focus{border-color:rgba(10,132,255,.9)}
.gchips{display:flex;flex-wrap:wrap;gap:8px}
.gchip{padding:8px 14px;border-radius:99px;font-size:14px;font-weight:600;background:rgba(255,255,255,.08);border:1px solid var(--stroke)}
.gchip.on{background:color-mix(in srgb,var(--c) 30%,transparent);border-color:var(--c);color:#fff}
.srow{display:grid;grid-template-columns:34px 1fr 34px;gap:9px;align-items:center;margin-bottom:8px}
.hint{font-size:12.5px;color:var(--text3);margin:6px 2px 0;line-height:1.45}
.toast{position:fixed;left:50%;bottom:calc(var(--sab) + 96px);transform:translate(-50%,16px);background:rgba(40,42,58,.85);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--stroke);padding:11px 20px;border-radius:99px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:99;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
.empty{text-align:center;color:var(--text3);padding:36px 0;font-size:14px}
</style>
</head>
<body>
<div class="bg"><i></i><i></i><i></i></div>

<div id="app">

  <section class="screen active" id="screen-profile">
    <div class="scroll">
      <div class="hero"><div class="logo">GymLog</div><p>Qui s'entraîne aujourd'hui ?</p></div>
      <div id="profiles"></div>
      <button class="linkbtn" onclick="openSettings()">Sauvegarde et restauration</button>
    </div>
  </section>

  <section class="screen" id="screen-home">
    <div class="topbar">
      <button class="avatar" id="home-avatar" onclick="goProfiles()" aria-label="Changer de profil"></button>
      <div class="tb-title"><small>Profil</small><h1 id="home-title"></h1></div>
      <button class="tb-btn" id="btn-edit-home" onclick="toggleEdit('home')">Modifier</button>
      <button class="tb-btn round" onclick="openSettings()" aria-label="Réglages">⚙︎</button>
    </div>
    <div class="scroll">
      <div class="tiles" id="tiles"></div>
      <div class="sec"><span>Mes séances</span></div>
      <div id="sessions"></div>
      <button class="btn ghost" onclick="sessSheet(null)">+ Nouvelle séance</button>
    </div>
  </section>

  <section class="screen" id="screen-session">
    <div class="topbar">
      <button class="tb-btn round" onclick="goHome()" aria-label="Retour">‹</button>
      <div class="tb-title"><small id="s-small"></small><h1 id="s-title"></h1></div>
      <button class="tb-btn" id="btn-edit-sess" onclick="toggleEdit('session')">Modifier</button>
    </div>
    <div class="scroll">
      <div id="exs"></div>
      <button class="btn ghost" onclick="exSheet(null)">+ Ajouter un exercice</button>
    </div>
    <div class="footer">
      <div class="prog"><div class="bar"><i id="prog-fill" style="width:0"></i></div><span id="prog-txt"></span></div>
      <button class="btn primary" onclick="startSession()">▶ Démarrer la séance</button>
    </div>
  </section>

  <section class="screen" id="screen-log">
    <div class="topbar">
      <button class="tb-btn round" onclick="goSession()" aria-label="Retour">‹</button>
      <div class="tb-title"><small id="l-small"></small><h1 id="l-title"></h1></div>
      <button class="tb-btn" onclick="openHistory()">Historique</button>
    </div>
    <div class="scroll">
      <div class="glass prev" id="prev"></div>
      <div class="sec"><span>Cette séance</span></div>
      <div class="sets-h"><span></span><span>Poids (kg)</span><span>Reps</span><span></span></div>
      <div id="sets"></div>
      <button class="btn ghost" onclick="addSet()">+ Ajouter une série</button>
      <div class="glass livebox"><span>Évolution vs dernière fois</span><span id="live"></span></div>
      <textarea class="note" id="note" placeholder="Notes (sensations, réglage de la machine…)" oninput="curNote=this.value"></textarea>
      <button class="btn primary" onclick="saveLog()">✓ Enregistrer</button>
    </div>
  </section>

  <section class="screen" id="screen-history">
    <div class="topbar">
      <button class="tb-btn round" onclick="goLog()" aria-label="Retour">‹</button>
      <div class="tb-title"><small>Historique</small><h1 id="h-title"></h1></div>
    </div>
    <div class="scroll" id="hist"></div>
  </section>
</div>

<div class="overlay hidden" id="overlay" onclick="if(event.target===this)closeSheet()">
  <div class="sheet"><div class="grab"></div><div id="sheet-body"></div></div>
</div>
<div class="toast" id="toast"></div>

<script>
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{})}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

const KEY='gymlog_v3';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let _u=0;const uid=()=>Date.now().toString(36)+(_u++).toString(36)+Math.random().toString(36).slice(2,5);
const GROUPS={Pecs:'#ff7a8a','Épaules':'#ffd166',Dos:'#5be3a0',Bras:'#ff9f5a',Jambes:'#5ac8fa',Abdos:'#c79bff',Autre:'#a0a4b8'};
const PROFILES=[{id:'thibaut',name:'Thibaut',hue:'#0a84ff'},{id:'felix',name:'Félix',hue:'#bf5af2'}];

/* ───────── Séances par défaut (issues du tableur) ───────── */
const E=(name,group,sets)=>({id:uid(),name,group,sets});
const R=(n,t)=>Array(n).fill(t);
function seedSessions(p){
  const upper=p==='thibaut'?[
    E('T-row','Dos',['4-6','6-10','6-10']),
    E('Smith incliné','Pecs',R(2,'6-8')),
    E('Smith plat','Pecs',R(2,'6-8')),
    E('Élévations latérales','Épaules',R(2,'8-12')),
    E('Écarté poulie haute','Pecs',R(2,'8-12')),
    E('Curl barre (pronosupination)','Bras',R(2,'10-12')),
    E('Extension triceps (V)','Bras',R(2,'10-12'))
  ]:[
    E('T-row','Dos',['4-6','6-10','6-10']),
    E('Smith incliné','Pecs',R(2,'6-8')),
    E('Tirage banc rhomboïdes','Dos',R(2,'8-10')),
    E('Élévations latérales','Épaules',R(2,'8-12')),
    E('Écarté poulie banc mid','Pecs',R(2,'8-12')),
    E('Curl barre (pronosupination)','Bras',R(2,'10-12')),
    E('Extension triceps (V)','Bras',R(2,'10-12'))
  ];
  return [
    {id:uid(),name:'Dos · Biceps',sub:'Dos (largeur), biceps',exercises:[
      E('Pull-over (préfatigue)','Dos',R(3,'8')),
      E('Tractions','Dos',['4-6','6-10','6-10']),
      E('Tirage vertical (supination)','Dos',R(2,'8-10')),
      E('Tirage banc (lats)','Dos',R(2,'8-10')),
      E('Low row','Dos',R(2,'8-10')),
      E('Curl (banc haltère / poulie)','Bras',R(3,'8-12')),
      E('Curl marteau','Bras',R(3,'8-12')),
      E('Extension lombaires','Dos',R(3,'8-12'))]},
    {id:uid(),name:'Pecs · Triceps',sub:'Pec (focus épaule), triceps',exercises:[
      E('Développé militaire','Épaules',['4-6','8-10','8-10']),
      E('Press pec incliné','Pecs',['6-8','8-10','8-10']),
      E('Élévations latérales','Épaules',R(3,'8-12')),
      E('Élévations frontales','Épaules',R(3,'8-12')),
      E('Écarté pec (guidé)','Pecs',R(2,'8-12')),
      E('Triceps corde (mid)','Bras',R(3,'8-12')),
      E('Extension triceps (V)','Bras',R(3,'8-12'))]},
    {id:uid(),name:'Jambes · Ischios',sub:'Jambes (focus ischio)',exercises:[
      E('Curl ischio unilatéral','Jambes',R(3,'8-10')),
      E('Adduction (adducteurs)','Jambes',R(3,'6-8')),
      E('RDL','Jambes',['4-6','8-10','8-10']),
      E('Extension quadriceps','Jambes',R(2,'8-10')),
      E('Curl ischio','Jambes',R(2,'8-10')),
      E('Perfect Squat (mollets)','Jambes',R(3,'8-12'))]},
    {id:uid(),name:'Upper',sub:'Haut du corps',exercises:upper},
    {id:uid(),name:'Jambes · Quadris',sub:'Jambes (focus quadriceps)',exercises:[
      E('Curl ischio unilatéral','Jambes',R(3,'8-10')),
      E('Adduction (adducteurs)','Jambes',R(3,'6-8')),
      E('Hack squat','Jambes',['4-6','6-10']),
      E('Extension unilatérale quadriceps','Jambes',R(2,'8-10')),
      E('Mollets assis','Jambes',R(3,'10-12'))]}
  ];
}

/* ───────── Données ───────── */
let db=null,me=null,sid=null,eid=null,editMode=false,cur=[],curNote='',editEx=null,editSess=null;
function ensure(){
  if(!db||typeof db!=='object'||!db.data)db={data:{}};
  PROFILES.forEach(p=>{
    const d=db.data[p.id]||(db.data[p.id]={});
    if(!Array.isArray(d.sessions))d.sessions=seedSessions(p.id);
    if(!Array.isArray(d.workouts))d.workouts=[];
  });
}
function load(){try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){db=null}ensure()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast('Stockage plein !')}}
const P=()=>db.data[me];
const S=()=>P().sessions.find(s=>s.id===sid);
const X=()=>S().exercises.find(e=>e.id===eid);

/* ───────── Utilitaires ───────── */
const dstr=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function fmtDate(s){const[y,m,d]=s.split('-').map(Number);const dt=new Date(y,m-1,d);const o={day:'numeric',month:'short'};if(y!==new Date().getFullYear())o.year='numeric';return dt.toLocaleDateString('fr-FR',o).replace(/\./g,'')}
const fmtN=n=>String(Math.round(n*100)/100).replace('.',',');
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)&&n>0?n:0};
const fmtSet=s=>s.w>0?`${fmtN(s.w)}×${s.r}`:`${s.r} reps`;
/* score d'une série : 1RM estimé (Epley) ; poids du corps → nb de reps */
const sScore=s=>s.w>0?s.w*(1+s.r/30):s.r;
const eScore=sets=>{const v=sets.filter(s=>s.w>0||s.r>0).map(sScore);return v.length?Math.max(...v):0};
const delta=(c,p)=>(p>0&&c>0)?(c/p-1)*100:null;
function chip(d){
  if(d==null)return'';
  const r=Math.round(d*10)/10;
  if(r===0)return'<span class="chip flat">＝ 0 %</span>';
  const up=r>0;
  return`<span class="chip ${up?'up':'down'}">${up?'▲ +':'▼ −'}${fmtN(Math.abs(r))} %</span>`;
}
function targets(ex){
  const s=ex.sets;if(!s.length)return'—';
  return s.every(t=>t===s[0])?`${s.length} × ${s[0]}`:s.join(' · ');
}
const sortedW=()=>[...P().workouts].sort((a,b)=>a.date.localeCompare(b.date)||a.ts-b.ts);
const entries=id=>sortedW().filter(w=>w.ex[id]).map(w=>({date:w.date,sets:w.ex[id].sets,note:w.ex[id].note||''}));
const prevEntry=(id,date)=>{const l=entries(id).filter(e=>e.date<date);return l[l.length-1]||null};
const todayEntry=id=>{const w=P().workouts.find(w=>w.date===dstr()&&w.ex[id]);return w?w.ex[id]:null};
function wDelta(w){
  const ds=[];
  for(const id in w.ex){
    const pv=prevEntry(id,w.date);
    if(pv){const d=delta(eScore(w.ex[id].sets),eScore(pv.sets));if(d!=null)ds.push(d)}
  }
  return ds.length?ds.reduce((a,b)=>a+b,0)/ds.length:null;
}
function sessStats(s){
  const ws=sortedW().filter(w=>w.sid===s.id);const l=ws[ws.length-1];
  return l?{last:l.date,delta:wDelta(l),count:ws.length}:{last:null,delta:null,count:0};
}
function nextSession(){
  const ss=P().sessions;if(!ss.length)return null;
  const ws=sortedW();if(!ws.length)return ss[0];
  const i=ss.findIndex(s=>s.id===ws[ws.length-1].sid);
  return i<0?ss[0]:ss[(i+1)%ss.length];
}
let _t;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(_t);_t=setTimeout(()=>t.classList.remove('show'),2200)}
function showScreen(id,keep){
  document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id==='screen-'+id));
  if(!keep){const sc=document.querySelector('#screen-'+id+' .scroll');if(sc)sc.scrollTop=0}
}
function openSheet(h){$('sheet-body').innerHTML=h;$('overlay').classList.remove('hidden')}
function closeSheet(){$('overlay').classList.add('hidden')}

/* ───────── Profils ───────── */
function renderProfiles(){
  $('profiles').innerHTML=PROFILES.map(p=>{
    const d=db.data[p.id];const ws=d.workouts;
    const last=ws.map(w=>w.date).sort().pop();
    return`<button class="glass pcard" onclick="pickProfile('${p.id}')">
      <div class="avatar" style="--h:${p.hue}">${p.name[0]}</div>
      <div><div class="pc-name">${p.name}</div>
      <div class="pc-sub">${d.sessions.length} séances · ${last?'dernière le '+fmtDate(last):'pas encore de séance'}</div></div>
      <span class="chev">›</span></button>`;
  }).join('');
}
function pickProfile(id){me=id;editMode=false;renderHome();showScreen('home')}
function goProfiles(){me=null;renderProfiles();showScreen('profile')}

/* ───────── Accueil ───────── */
function renderHome(){
  const p=PROFILES.find(x=>x.id===me),d=P();
  $('home-avatar').textContent=p.name[0];$('home-avatar').style.setProperty('--h',p.hue);
  $('home-title').textContent=p.name;
  $('btn-edit-home').textContent=editMode?'OK':'Modifier';
  const ws=sortedW(),last=ws[ws.length-1];
  const week=dstr(new Date(Date.now()-6*864e5));
  $('tiles').innerHTML=`
    <div class="glass tile"><small>Séances faites</small><b>${ws.length}</b></div>
    <div class="glass tile"><small>7 derniers jours</small><b>${ws.filter(w=>w.date>=week).length}</b></div>
    <div class="glass tile"><small>Dernière séance</small>${last&&wDelta(last)!=null?chip(wDelta(last)):'<b>—</b>'}</div>`;
  const nx=nextSession();
  $('sessions').innerHTML=d.sessions.length?d.sessions.map((s,i)=>{
    const st=sessStats(s),n=s.exercises.reduce((a,e)=>a+e.sets.length,0),isNext=nx&&nx.id===s.id&&!editMode;
    return`<div class="glass scard ${isNext?'next':''}" ${editMode?'':`onclick="openSession('${s.id}')"`}>
      <div class="snum">${i+1}</div>
      <div class="sbody"><div class="sname">${esc(s.name)}</div><div class="ssub">${esc(s.sub||'')}</div>
      <div class="smeta">${s.exercises.length} exercices · ${n} séries</div></div>
      <div class="sright">${isNext?'<span class="tag">Prochaine</span>':''}
        ${st.last?`<div class="sdate">${fmtDate(st.last)}</div>`:'<div class="sdate muted">Jamais faite</div>'}${chip(st.delta)}</div>
      ${editMode?`<div class="ctrls">
        <button class="ctrl" onclick="sessSheet('${s.id}')">Modifier</button>
        <button class="ctrl" onclick="moveSess('${s.id}',-1)">↑</button>
        <button class="ctrl" onclick="moveSess('${s.id}',1)">↓</button>
        <button class="ctrl del" onclick="delSess('${s.id}')">Suppr.</button></div>`:''}
    </div>`;
  }).join(''):'<div class="empty">Aucune séance. Crée la première !</div>';
}
function goHome(){editMode=false;renderHome();showScreen('home',true)}
function toggleEdit(w){editMode=!editMode;w==='home'?renderHome():renderSession()}
function moveArr(a,i,dir){const j=i+dir;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]]}
function moveSess(id,dir){const a=P().sessions;moveArr(a,a.findIndex(s=>s.id===id),dir);save();renderHome()}
function delSess(id){
  const s=P().sessions.find(x=>x.id===id);
  if(!confirm(`Supprimer « ${s.name} » et tout son historique ?`))return;
  P().sessions=P().sessions.filter(x=>x.id!==id);
  P().workouts=P().workouts.filter(w=>w.sid!==id);
  save();renderHome();
}
function sessSheet(id){
  editSess=id?{...P().sessions.find(s=>s.id===id)}:{id:null,name:'',sub:''};
  openSheet(`<h3>${id?'Modifier la séance':'Nouvelle séance'}</h3>
    <label class="fl">Nom</label><input class="field" value="${esc(editSess.name)}" placeholder="Ex : Dos · Biceps" oninput="editSess.name=this.value">
    <label class="fl">Description (optionnel)</label><input class="field" value="${esc(editSess.sub)}" placeholder="Ex : Dos (largeur), biceps" oninput="editSess.sub=this.value">
    <div class="btns"><button class="btn ghost" onclick="closeSheet()">Annuler</button><button class="btn primary" onclick="saveSess()">Enregistrer</button></div>`);
}
function saveSess(){
  const name=editSess.name.trim();if(!name){toast('Donne un nom à la séance');return}
  if(editSess.id){const s=P().sessions.find(x=>x.id===editSess.id);s.name=name;s.sub=editSess.sub.trim()}
  else P().sessions.push({id:uid(),name,sub:editSess.sub.trim(),exercises:[]});
  save();closeSheet();renderHome();
}

/* ───────── Séance ───────── */
function openSession(id){sid=id;editMode=false;renderSession();showScreen('session')}
function renderSession(){
  const s=S(),i=P().sessions.indexOf(s),st=sessStats(s);
  $('s-small').textContent=`Séance ${i+1}${st.last?' · dernière le '+fmtDate(st.last):' · jamais faite'}`;
  $('s-title').textContent=s.name;
  $('btn-edit-sess').textContent=editMode?'OK':'Modifier';
  $('exs').innerHTML=s.exercises.length?s.exercises.map((ex,k)=>{
    const prev=prevEntry(ex.id,dstr()),td=todayEntry(ex.id);
    const ref=td?prevEntry(ex.id,dstr()):null;
    const right=td?`<div class="done">✓</div>${chip(ref?delta(eScore(td.sets),eScore(ref.sets)):null)}`:'';
    return`<div class="glass ecard" ${editMode?'':`onclick="openLog('${ex.id}')"`}>
      <div class="ebar" style="--c:${GROUPS[ex.group]||GROUPS.Autre}"></div>
      <div class="ebody"><div class="ename">${esc(ex.name)}</div>
        <div class="etarget">${esc(ex.group)} · ${esc(targets(ex))}</div>
        <div class="elast">${td?`Aujourd'hui : <b>${td.sets.map(fmtSet).join(' · ')}</b>`:prev?`${fmtDate(prev.date)} : <b>${prev.sets.map(fmtSet).join(' · ')}</b>`:'Pas encore de données'}</div></div>
      <div class="eright">${right}</div>
      ${editMode?`<div class="ctrls">
        <button class="ctrl" onclick="exSheet('${ex.id}')">Modifier</button>
        <button class="ctrl" onclick="moveEx('${ex.id}',-1)">↑</button>
        <button class="ctrl" onclick="moveEx('${ex.id}',1)">↓</button>
        <button class="ctrl del" onclick="delEx('${ex.id}')">Suppr.</button></div>`:''}
    </div>`;
  }).join(''):'<div class="empty">Aucun exercice. Ajoutes-en un !</div>';
  const done=s.exercises.filter(e=>todayEntry(e.id)).length,tot=s.exercises.length;
  $('prog-fill').style.width=tot?(done/tot*100)+'%':'0';
  $('prog-txt').textContent=`${done}/${tot} exercices`;
}
function goSession(){renderSession();showScreen('session',true)}
function startSession(){
  const s=S();if(!s.exercises.length){toast('Ajoute d’abord un exercice');return}
  openLog((s.exercises.find(e=>!todayEntry(e.id))||s.exercises[0]).id);
}
function moveEx(id,dir){const a=S().exercises;moveArr(a,a.findIndex(e=>e.id===id),dir);save();renderSession()}
function delEx(id){
  const e=S().exercises.find(x=>x.id===id);
  if(!confirm(`Supprimer « ${e.name} » de cette séance ?`))return;
  S().exercises=S().exercises.filter(x=>x.id!==id);save();renderSession();
}
function exSheet(id){
  if(arguments.length&&id!==undefined&&!editEx)editEx=null;
  if(id!==undefined&&(editEx===null||editEx.__open!==true||(id!==null&&editEx.id!==id))){
    if(id){const e=S().exercises.find(x=>x.id===id);editEx={id:e.id,name:e.name,group:e.group,sets:[...e.sets],__open:true}}
    else editEx={id:null,name:'',group:'Autre',sets:['8-12','8-12','8-12'],__open:true};
  }
  const last=editEx.sets.length;
  openSheet(`<h3>${editEx.id?'Modifier l’exercice':'Nouvel exercice'}</h3>
    <label class="fl">Nom</label><input class="field" value="${esc(editEx.name)}" placeholder="Ex : Développé incliné Smith" oninput="editEx.name=this.value">
    <label class="fl">Groupe musculaire</label>
    <div class="gchips">${Object.keys(GROUPS).map(g=>`<button class="gchip ${editEx.group===g?'on':''}" style="--c:${GROUPS[g]}" onclick="editEx.group='${g}';exSheet()">${g}</button>`).join('')}</div>
    <label class="fl">Séries et répétitions visées</label>
    ${editEx.sets.map((t,i)=>`<div class="srow"><span class="sn">${i+1}</span>
      <input class="field" value="${esc(t)}" placeholder="8-10" oninput="editEx.sets[${i}]=this.value">
      <button class="x" ${last<=1?'disabled':''} onclick="editEx.sets.splice(${i},1);exSheet()">✕</button></div>`).join('')}
    <button class="btn ghost" onclick="editEx.sets.push(editEx.sets[editEx.sets.length-1]||'8-12');exSheet()">+ Ajouter une série</button>
    <p class="hint">Le nombre de lignes = le nombre de séries. Tu peux écrire une fourchette (8-10) ou un nombre fixe (8).</p>
    <div class="btns"><button class="btn ghost" onclick="closeEx()">Annuler</button><button class="btn primary" onclick="saveEx()">Enregistrer</button></div>`);
}
function closeEx(){editEx=null;closeSheet()}
function saveEx(){
  const name=editEx.name.trim();if(!name){toast('Donne un nom à l’exercice');return}
  const sets=editEx.sets.map(t=>String(t).trim()||'8-12');
  if(editEx.id){const e=S().exercises.find(x=>x.id===editEx.id);e.name=name;e.group=editEx.group;e.sets=sets}
  else S().exercises.push({id:uid(),name,group:editEx.group,sets});
  editEx=null;save();closeSheet();renderSession();
}

/* ───────── Enregistrement d'un exercice ───────── */
function openLog(id){
  eid=id;const ex=X(),prev=prevEntry(id,dstr()),td=todayEntry(id);
  $('l-small').textContent=`${ex.group} · ${S().name}`;$('l-title').textContent=ex.name;
  if(td){cur=td.sets.map(s=>({w:s.w?String(s.w).replace('.',','):'',r:s.r?String(s.r):''}));curNote=td.note||''}
  else{
    cur=ex.sets.map((t,i)=>{const p=prev?(prev.sets[i]||prev.sets[prev.sets.length-1]):null;
      return{w:p&&p.w?String(p.w).replace('.',','):'',r:p&&p.r?String(p.r):''}});
    curNote='';
  }
  $('note').value=curNote;
  $('prev').innerHTML=prev?`<h4><span>Dernière fois</span><span>${fmtDate(prev.date)}</span></h4>
      ${prev.sets.map((s,i)=>`<div class="prow"><span>Série ${i+1}</span><span>${s.w>0?fmtN(s.w)+' kg × '+s.r:s.r+' reps'}</span></div>`).join('')}
      ${prev.note?`<div class="note-prev">« ${esc(prev.note)} »</div>`:''}`
    :`<h4><span>Première fois</span></h4><div class="prow"><span>Objectif</span><span>${esc(targets(ex))}</span></div><div class="note-prev">Rentre tes charges, elles serviront de référence la prochaine fois.</div>`;
  renderSets();showScreen('log');
}
function renderSets(){
  const ex=X();
  $('sets').innerHTML=cur.map((s,i)=>`<div class="set-row">
    <div class="sn">${i+1}</div>
    <input class="si" type="text" inputmode="decimal" placeholder="kg" value="${esc(s.w)}" oninput="cur[${i}].w=this.value;live()">
    <input class="si" type="text" inputmode="numeric" placeholder="${esc(ex.sets[i]||ex.sets[ex.sets.length-1]||'reps')}" value="${esc(s.r)}" oninput="cur[${i}].r=this.value;live()">
    <button class="x" ${cur.length<=1?'disabled':''} onclick="rmSet(${i})" aria-label="Supprimer la série">✕</button></div>`).join('');
  live();
}
function addSet(){const l=cur[cur.length-1]||{w:'',r:''};cur.push({w:l.w,r:l.r});renderSets()}
function rmSet(i){if(cur.length>1){cur.splice(i,1);renderSets()}}
const parsed=()=>cur.map(s=>({w:num(s.w),r:Math.round(num(s.r))})).filter(s=>s.w>0||s.r>0);
function live(){
  const prev=prevEntry(eid,dstr()),sets=parsed();
  $('live').innerHTML=prev&&sets.length?(chip(delta(eScore(sets),eScore(prev.sets)))||'—'):'<span style="color:var(--text3)">—</span>';
}
function saveLog(){
  const sets=parsed();if(!sets.length){toast('Entre au moins une série');return}
  const prev=prevEntry(eid,dstr()),d=prev?delta(eScore(sets),eScore(prev.sets)):null;
  let w=P().workouts.find(x=>x.sid===sid&&x.date===dstr());
  if(!w){w={id:uid(),sid,date:dstr(),ts:Date.now(),ex:{}};P().workouts.push(w)}
  w.ex[eid]={sets,note:curNote.trim()};
  save();
  const r=d==null?null:Math.round(d*10)/10;
  toast('Enregistré'+(r==null?'':r===0?' · stable':` · ${r>0?'+':'−'}${fmtN(Math.abs(r))} %`));
  const s=S(),i=s.exercises.findIndex(e=>e.id===eid);
  const nx=s.exercises.slice(i+1).find(e=>!todayEntry(e.id));
  setTimeout(()=>nx?openLog(nx.id):goSession(),350);
}
function goLog(){showScreen('log',true)}

/* ───────── Historique d'un exercice ───────── */
function spark(vals){
  if(vals.length<2)return'<div class="empty" style="padding:20px 0">Il faut au moins 2 séances pour tracer la courbe.</div>';
  const W=320,H=100,pl=10,pr=10,pt=12,pb=12,mn=Math.min(...vals),mx=Math.max(...vals),rg=(mx-mn)||1;
  const pts=vals.map((v,i)=>[pl+i*(W-pl-pr)/(vals.length-1),H-pb-(v-mn)/rg*(H-pt-pb)]);
  const line=pts.map(p=>p.join(',')).join(' ');
  const area=`M${pts[0][0]},${H} L${pts.map(p=>p.join(',')).join(' L')} L${pts[pts.length-1][0]},${H}Z`;
  return`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Courbe de progression"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a84ff" stop-opacity=".5"/><stop offset="1" stop-color="#0a84ff" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#g)"/><polyline points="${line}" fill="none" stroke="#5ac8fa" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${i===pts.length-1?4.5:3}" fill="${i===pts.length-1?'#fff':'#5ac8fa'}"/>`).join('')}</svg>`;
}
function openHistory(){
  const es=entries(eid);$('h-title').textContent=X().name;
  const scores=es.map(e=>eScore(e.sets));
  const best=es.length?Math.max(...es.flatMap(e=>e.sets.map(s=>s.w))):0;
  const tot=es.length>1?delta(scores[scores.length-1],scores[0]):null;
  $('hist').innerHTML=es.length?`
    <div class="tiles">
      <div class="glass tile"><small>Séances</small><b>${es.length}</b></div>
      <div class="glass tile"><small>Charge max</small><b>${best>0?fmtN(best):'—'}<span style="font-size:13px;color:var(--text2)"> ${best>0?'kg':''}</span></b></div>
      <div class="glass tile"><small>Depuis le début</small>${tot!=null?chip(tot):'<b>—</b>'}</div></div>
    <div class="glass spark">${spark(scores)}</div>
    ${[...es].reverse().map((e,k,a)=>{
      const pv=a[k+1];const d=pv?delta(eScore(e.sets),eScore(pv.sets)):null;
      return`<div class="glass hitem"><div class="hhead"><span>${fmtDate(e.date)}</span>${chip(d)}</div>
        ${e.sets.map((s,i)=>`<div class="prow"><span>Série ${i+1}</span><span>${s.w>0?fmtN(s.w)+' kg × '+s.r:s.r+' reps'}</span></div>`).join('')}
        ${e.note?`<div class="note-prev">« ${esc(e.note)} »</div>`:''}</div>`}).join('')}`
  :'<div class="empty">Aucun historique pour cet exercice.</div>';
  showScreen('history');
}

/* ───────── Sauvegarde / restauration ───────── */
function openSettings(){
  openSheet(`<h3>Sauvegarde</h3>
    <p class="hint" style="margin:0 0 14px">Tes données sont stockées uniquement sur ce téléphone. Fais une sauvegarde de temps en temps, surtout avant de changer de téléphone.</p>
    <button class="btn primary" onclick="exportData()">Exporter mes données</button>
    <label class="btn ghost" style="cursor:pointer">Importer une sauvegarde<input type="file" accept=".json,application/json" hidden onchange="importData(this)"></label>
    <button class="btn ghost" onclick="closeSheet()">Fermer</button>`);
}
async function exportData(){
  const blob=new Blob([JSON.stringify(db)],{type:'application/json'});
  const file=new File([blob],`gymlog-${dstr()}.json`,{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:'Sauvegarde GymLog'});return}catch(e){if(e.name==='AbortError')return}
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=file.name;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
function importData(inp){
  const f=inp.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);if(!d||!d.data)throw 0;
      if(!confirm('Remplacer toutes les données de ce téléphone par cette sauvegarde ?'))return;
      db=d;ensure();save();closeSheet();goProfiles();toast('Sauvegarde restaurée');
    }catch(e){toast('Fichier invalide')}
  };
  r.readAsText(f);inp.value='';
}

load();renderProfiles();
</script>
